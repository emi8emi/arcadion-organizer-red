# A local PostgreSQL for development and for the tests:  docker compose up -d   (run it in this folder)
# POSTGRES_USER and POSTGRES_PASSWORD come from .env here. It creates the database `raidbot` for the bot and the
# dashboard; the tests create their own `raidtest` the first time they run. Local use only: for a real server use
# your own credentials and sslmode=require.
# The fixed name keeps the project (and the raid-pgdata volume) the same wherever this file lives.
name: raid-bot

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: raidbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raid-pgdata:/var/lib/postgresql/data

volumes:
  raid-pgdata:
